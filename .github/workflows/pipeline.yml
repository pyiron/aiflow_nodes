name: Pipeline

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: lint
          locked: true
          cache: true
      - run: pixi run -e lint lint
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Pre-commit hooks (notebook outputs, binaries, large files)
        run: pixi run -e lint hooks

  tests:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # aiflow is a private repository; pixi fetches it with git, so hand git a
      # read-only token for that one URL.
      - name: Grant read access to pyiron/aiflow
        env:
          TOKEN: ${{ secrets.AIFLOW_READ }}
        run: >-
          git config --global
          url."https://x-access-token:${TOKEN}@github.com/pyiron/aiflow".insteadOf
          "https://github.com/pyiron/aiflow"
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: test
          locked: true
          cache: true
      - name: Test
        run: |
          pixi run -e test test
          pixi run -e test coverage xml --rcfile=.coveragerc
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
