[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiflow_nodes"
version = "0.0.1"
description = "Node library for pyiron/aiflow workflows"
readme = "README.md"
requires-python = ">=3.11"
# aiflow is not on PyPI yet; the pixi workspace below pins it to a git commit.
dependencies = [
    "aiflow",
    "ase>=3.26",
    "cloudpickle",
    "executorlib",
    "jinja2",
    "matplotlib",
    "numpy>=2",
    "pandas",
    "pint",
    "pyyaml",
    "scipy",
    "tqdm",
]

# Subpackages that need a heavier stack import it themselves; install the extra
# that matches the nodes you use.
[project.optional-dependencies]
# On PyPI the lammps and gpaw extras bring only the Python side; the LAMMPS and
# GPAW programs come from conda-forge (the conda outputs include them) or a
# local build.
lammps = ["lammpsparser", "pyiron_lammps>=0.5"]
vasp = ["pymatgen>=2025", "vaspparser"]
structure = [
    "phonopy",
    "pymatgen>=2025",
    "pymatgen-analysis-defects",
    "spglib",
    "structuretoolkit",
]
thermodynamics = ["calphy", "landau>=1.5", "pyscal3", "seaborn"]
# python-ace provides the `pyace` module; `pyace` on PyPI is an unrelated package.
ml = ["matgl", "python-ace", "scikit-learn", "tensorpotential"]
assyst = ["assyst"]
# Separate from assyst: conda-forge's osx-arm64 gpaw needs a numpy that
# pyiron_atomistics does not allow, so environments choose it per platform.
gpaw = ["gpaw"]
pyiron = ["pyiron_snippets"]
database = ["h5io_browser", "pyfileindex", "sqlalchemy"]
viz = ["ipython", "nglview", "pygments", "seaborn"]
all = [
    "aiflow_nodes[lammps,vasp,structure,thermodynamics,ml,assyst,gpaw,pyiron,database,viz]",
]

# Lets the aiflow.ai workflow assistant compose workflows from these nodes.
[project.entry-points."aiflow.node_libraries"]
aiflow_nodes = "aiflow_nodes.assistant_plugin:library"

[tool.hatch.build.targets.wheel]
packages = ["src/aiflow_nodes"]

# --------------------------------------------------------------------------- #
#  pixi workspace: `pixi install`, `pixi run test`                            #
# --------------------------------------------------------------------------- #

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[tool.pixi.activation.env]
# The conda-forge tensorflow build (pulled in by grace-tensorpotential) has an
# executable-stack flag that glibc >= 2.41 refuses to load. Ignored by older glibc.
GLIBC_TUNABLES = "glibc.rtld.execstack=2"

[tool.pixi.dependencies]
python = "3.12.*"

# The package's conda dependencies, declared once here. Workspaces that develop
# aiflow_nodes (this one, and the aiflow_env bundle) pull them in through their
# [dev] table and install the package itself as an editable PyPI dependency.
# Everything that conda-forge provides comes from conda-forge; conda packages
# take precedence over the same requirement in [project].
[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"

[tool.pixi.package.host-dependencies]
hatchling = "*"

[tool.pixi.package.run-dependencies]
# The conda side of [project]: the same requirements and bounds, plus what
# only conda-forge provides (marked below).  Exact versions live in pixi.lock.
ase = ">=3.26"
cloudpickle = "*"
executorlib = "*"
# aiflow's, which is installed from PyPI (it has no conda package yet).
h5py = "*"
jinja2 = "*"
matplotlib = "*"
numpy = ">=2"  # calphy 1.7.2 uses numpy.trapezoid
pandas = "*"
pint = "*"
pyyaml = "*"
scipy = "*"
tqdm = "*"
# lammps; conda-only: the LAMMPS program (MPI build) and its potentials
lammps = { version = "*", build = "*openmpi*" }
iprpy-data = "*"
lammpsparser = "*"
pyiron_lammps = ">=0.5"
# vasp / structure
phonopy = "*"
pymatgen = ">=2025"
pymatgen-analysis-defects = "*"
spglib = "*"
structuretoolkit = "*"
vaspparser = "*"
# thermodynamics
calphy = "*"
landau = ">=1.5"
pyscal3 = "*"
seaborn = "*"
# ml
grace-tensorpotential = "*"
matgl = "*"
python-ace = "*"
scikit-learn = "*"
# assyst
assyst = "*"
# pyiron
pyiron_snippets = "*"
# database
h5io_browser = "*"
pyfileindex = "*"
sqlalchemy = "*"
# viz
ipython = "*"
nglview = "*"
pygments = "*"

# conda-forge only has gpaw 26.7 for osx-arm64, which needs numpy >= 2.5.3 and
# conflicts with pyiron_atomistics (numpy <= 2.3.5). gpaw is imported lazily,
# so only the GPAW calculator nodes are unavailable on macOS.
[tool.pixi.package.run-dependencies."if(host_platform == 'linux-64')"]
gpaw = "*"

[tool.pixi.dev]
aiflow_nodes = { path = "." }

[tool.pixi.pypi-dependencies]
# Private repository: needs GitHub access to pyiron/aiflow (gh credential
# helper or SSH locally, the AIFLOW_READ token in CI). Bump on purpose.
aiflow = { git = "https://github.com/pyiron/aiflow.git", rev = "1b8d2377f30b68e9967df6e225b813b2e544b310" }
aiflow_nodes = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
coverage = "*"
pytest = ">=8"
# pylint reads the installed packages, so it runs here, not in the lint env.
pylint = ">=4.1,<5"

[tool.pixi.feature.test.tasks]
test = "coverage run --rcfile=.coveragerc && coverage report --rcfile=.coveragerc"
pylint = "pylint src/aiflow_nodes"

[tool.pixi.feature.lint.dependencies]
ruff = "==0.17.3"
pre-commit = "*"

[tool.pixi.feature.lint.tasks]
lint = "ruff check . && ruff format --check --diff ."
hooks = "pre-commit run --all-files --show-diff-on-failure"

# deptry inspects the installed packages, so it runs in the full environment.
[tool.pixi.feature.deptry.dependencies]
deptry = ">=0.25.1,<0.26"

[tool.pixi.feature.deptry.tasks]
deptry = "deptry src"

[tool.pixi.environments]
default = { features = ["test", "lint", "deptry"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }

[tool.deptry]
# Notebooks under src/ are examples, not package code.
extend_exclude = [".*\\.ipynb"]

[tool.deptry.package_module_name_map]
# conda-forge's python-ace installs its metadata as `pyace`.
python-ace = "pyace"

[tool.deptry.per_rule_ignores]
# Not declared: qe_xml_parser (Quantum ESPRESSO) is not packaged.
DEP001 = ["qe_xml_parser"]
# pixi installs the package itself into its environment.
DEP002 = ["aiflow_nodes"]

# pylint runs only the checks that read the installed packages and that ruff
# cannot do: imported names that no longer exist, unbound variables and calls
# that do not match the signature.  The rest is either ruff's job or noise from
# aiflow's dynamically built node classes (no-member, invalid-field-call).
[tool.pylint.main]
jobs = 0
# Names pylint cannot see: pygments creates its lexers and formatters lazily,
# and qe_xml_parser (Quantum ESPRESSO) is not packaged.
ignored-modules = ["pygments.lexers", "pygments.formatters", "qe_xml_parser"]
# Voronoi and Delaunay live in a compiled extension.
extension-pkg-allow-list = ["scipy.spatial._qhull"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "import-error",                    # E0401
    "no-name-in-module",               # E0611
    "used-before-assignment",          # E0601
    "undefined-variable",              # E0602
    "possibly-used-before-assignment", # E0606
    "no-value-for-parameter",          # E1120
    "unexpected-keyword-arg",          # E1123
]

[tool.pylint.reports]
score = false

[tool.ruff]
exclude = [
    "docs",
    "notebooks",
]

[tool.ruff.format]
# Ruff also formats the code blocks in Markdown.  Leave the guides as written:
# src/aiflow_nodes/guides/node_guide.md is a prompt for the aiflow.ai
# assistant, where the compact hand layout is deliberate.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "I",   # isort
    "C4",  # flake8-comprehensions
    # Not enabled yet, too many violations to fix in one go:
    # "B",   # flake8-bugbear
    # "ERA", # eradicate
    # "PL",  # pylint
]
ignore = [
    "E402",   # module-level import not at top of file
    "E501",   # line length handled by formatter
    "PLC0415",# import should be at top-level (pylint rule)
    "PLR0913",# too many arguments
    "PLR2004",# magic values in comparisons
    "PLR0912",# too many branches
    "SIM108", # ternary instead of if-else block, often less readable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # submodule imports populate the package namespace
"workflows/whileloop.py_fix.py" = ["F821"]  # patch snippet, not runnable on its own
"src/aiflow_nodes/electrochemistry/tb/ham.py" = ["E741"]  # l, m, n are direction cosines
